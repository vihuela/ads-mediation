name: Publish GitHub Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version (empty to increment latest patch)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version }}
      GITHUB_PACKAGES_USERNAME: ${{ secrets.PACKAGES_USERNAME }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and publish next version
        run: ./scripts/publish-next-version.sh
